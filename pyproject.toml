[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-agent-assistant"
version = "0.1.0"
description = "A traceable RAG agent for simulated robot after-sales support."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [
    { name = "RAG Agent Learner" },
]
dependencies = [
    "chromadb>=1,<2",
    "fonttools>=4,<5",
    "httpx>=0.28,<1",
    "langchain>=1,<2",
    "langchain-chroma>=1,<2",
    "langchain-text-splitters>=1,<2",
    "langgraph>=1,<2",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "streamlit>=1.57,<2",
]

[project.scripts]
rag-agent = "rag_agent.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Chinese full-width punctuation is intentional in prompts, log messages, docstrings and in
# the sentence-boundary classes of the injection patterns; RUF001 treats it as confusable
# with ASCII punctuation.
allowed-confusables = ["，", "；", "？", "：", "（", "）", "！", "。", "、", "“", "”", "·"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
